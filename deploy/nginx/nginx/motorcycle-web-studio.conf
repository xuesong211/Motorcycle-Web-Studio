server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 43.165.191.60 _;

    root /opt/motorcycle-web-studio/app/dist/client;
    index index.html;

    # 带内容哈希的构建资源可长期缓存。
    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|svg|ico|webp|avif|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
