upstream motorcycle_web_studio_runtime {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    # 将此路径改为发布包的实际解压路径。
    root /opt/motorcycle-web-studio/app/dist/client;

    # 带内容哈希的构建资源可长期缓存，页面请求仍交由 SSR 运行时处理。
    location ^~ /_next/static/ {
        try_files $uri @motorcycle_runtime;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|svg|ico|webp|avif|woff2?)$ {
        try_files $uri @motorcycle_runtime;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://motorcycle_web_studio_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @motorcycle_runtime {
        proxy_pass http://motorcycle_web_studio_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
